services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loadtester
      POSTGRES_PASSWORD: loadtester
      POSTGRES_DB: loadtester
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtester"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy && npx tsx scripts/seed.ts"
    environment:
      DATABASE_URL: postgresql://loadtester:loadtester@postgres:5432/loadtester?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-please}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    command: npm run start
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://loadtester:loadtester@postgres:5432/loadtester?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-please}
      APP_URL: ${APP_URL:-http://localhost:3000}
      MAX_GLOBAL_RPS: ${MAX_GLOBAL_RPS:-2000}
      MAX_GLOBAL_CONCURRENCY: ${MAX_GLOBAL_CONCURRENCY:-500}
      MAX_TEST_DURATION: ${MAX_TEST_DURATION:-300}
      TRUSTED_PROXY_MODE: ${TRUSTED_PROXY_MODE:-none}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: npx tsx worker/index.ts
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://loadtester:loadtester@postgres:5432/loadtester?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-please}
      WORKER_ID: worker-1
      MAX_GLOBAL_RPS: ${MAX_GLOBAL_RPS:-2000}
      MAX_GLOBAL_CONCURRENCY: ${MAX_GLOBAL_CONCURRENCY:-500}
      MAX_TEST_DURATION: ${MAX_TEST_DURATION:-300}
      MAX_CONCURRENT_TESTS: ${MAX_CONCURRENT_TESTS:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # Local-only echo service so you have an authorized target to test against.
  echo:
    image: ealen/echo-server:latest
    environment:
      PORT: "8080"
    expose:
      - "8080"

volumes:
  pgdata:
